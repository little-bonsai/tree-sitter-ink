name: CI (dev)

on:
  push:
    branches: [dev]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test parser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
      - name: Run tests
        run: tree-sitter test

  build_release:
    name: Build release artifacts (dry-run)
    runs-on: ubuntu-latest
    env:
      REPO_NAME: ${{github.event.repository.name}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up tree-sitter CLI
        uses: tree-sitter/setup-action/cli@v2
      - name: Generate parser
        run: tree-sitter generate
      - name: Build Wasm binaries
        run: tree-sitter build --wasm .
      - name: Create source code tarball
        run: |
          git ls-files > "$RUNNER_TEMP/files"
          while read -r src_dir; do
            printf '%s\n' >> "$RUNNER_TEMP/files" \
              "$src_dir"/parser.c "$src_dir"/grammar.json \
              "$src_dir"/node-types.json "$src_dir"/tree_sitter/*
          done < <(jq -r "$JQ_SCRIPT" tree-sitter.json)
          tar cvzf "$REPO_NAME.tar.gz" -T <(sort -u "$RUNNER_TEMP/files")
        env:
          JQ_SCRIPT: >-
            .grammars[] |
            if (.path? // ".") == "."
            then "src"
            else "\(.path)/src"
            end
      - name: Verify artifacts
        run: |
          ls -la *.wasm *.tar.gz
          echo "Release artifacts built successfully"

  build_crates:
    name: Publish Rust package (dry-run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Set up tree-sitter CLI
        uses: tree-sitter/setup-action/cli@v2
      - name: Generate parser
        run: tree-sitter generate
      - name: Check for dirty files after generate
        run: |
          git diff --stat
          git diff src/parser.c | head -80
      - name: Dry-run publish to crates.io
        run: cargo publish --dry-run --allow-dirty

  build_npm_wasm:
    name: Build Wasm binaries (npm)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up NodeJS
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 22
      - name: Install dependencies
        run: npm i --omit peer --omit optional
      - name: Regenerate parser
        run: npm x -- tree-sitter generate
      - name: Build Wasm binaries
        run: npm x -- tree-sitter build --wasm .
      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          path: "*.wasm"
          name: prebuilds-wasm
          retention-days: 1

  build_npm_node:
    name: Build NodeJS binaries
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up NodeJS
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 22
      - name: Install dependencies
        run: npm i --omit peer --omit optional
      - name: Regenerate parser
        run: npm x -- tree-sitter generate
      - name: Build binary
        run: npm x -- prebuildify -t 20.19.5
      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          path: prebuilds/**
          name: prebuilds-${{matrix.os}}
          retention-days: 1

  npm_dry_run:
    name: npm publish (dry-run)
    needs: [build_npm_wasm, build_npm_node]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up NodeJS
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          path: prebuilds
          pattern: prebuilds-*
          merge-multiple: true
      - name: Dry-run npm publish
        run: npm publish --dry-run
